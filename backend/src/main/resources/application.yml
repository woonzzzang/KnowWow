server:
  port: 8080

spring:
  application:
    name: knowflow-backend

management:
  endpoints:
    web:
      exposure:
        include: health,info

knowflow:
  data-path: ${DATA_PATH:../data}
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}

