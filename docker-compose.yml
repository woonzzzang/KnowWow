services:
  ai-service:
    build:
      context: ./ai-service
    env_file:
      - .env
    ports:
      - "8000:8000"

  backend:
    build:
      context: ./backend
    environment:
      AI_SERVICE_URL: http://ai-service:8000
      ALLOWED_ORIGINS: http://localhost:3000
      DATA_PATH: /app/data
    volumes:
      - ./data:/app/data
    depends_on:
      - ai-service
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"

